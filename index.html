<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="title">Kamus Multibahasa - Bahasa Daerah</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pap3x9z+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --bg-color: #e0e5ec;
      --text-main: #3d4852;
      --text-muted: #718096;
      --primary: #4f46e5;
      
      /* Neumorphic Shadows */
      --neu-drop: 9px 9px 16px #bebebe, -9px -9px 16px #ffffff;
      --neu-inset: inset 6px 6px 10px #bebebe, inset -6px -6px 10px #ffffff;
      --neu-btn: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
      --neu-btn-active: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .translator-card {
      background: var(--bg-color);
      width: 100%;
      max-width: 720px;
      border-radius: 24px;
      box-shadow: var(--neu-drop);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .add-word-trigger {
      background: var(--bg-color);
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: var(--neu-btn);
      cursor: pointer;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .add-word-trigger:active {
      box-shadow: var(--neu-btn-active);
    }

    /* BAR BAHASA DAN DROPDOWN TRIBES */
    .language-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .select-wrapper {
      flex: 1;
      position: relative;
      background: var(--bg-color);
      border-radius: 12px;
      box-shadow: var(--neu-inset);
      display: flex;
      align-items: center;
      padding: 2px 12px;
    }

    .lang-select {
      width: 100%;
      padding: 10px 20px 10px 4px;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.95rem;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      text-align: center;
    }

    .select-wrapper::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      color: var(--primary);
      position: absolute;
      right: 12px;
      pointer-events: none;
      font-size: 0.85rem;
    }

    .lang-select option {
      color: var(--text-main);
      background: var(--bg-color);
    }

    .swap-btn {
      background: var(--bg-color);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      min-width: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--neu-btn);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .swap-btn:active {
      box-shadow: var(--neu-btn-active);
    }

    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .card-body {
        grid-template-columns: 1fr;
      }
      
      .language-bar {
        gap: 8px;
      }
      
      .lang-select {
        font-size: 0.85rem;
        padding: 8px 16px 8px 0px;
      }
    }

    .text-box-container {
      background: var(--bg-color);
      border-radius: 16px;
      box-shadow: var(--neu-inset);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    textarea {
      width: 100%;
      height: 140px;
      border: none;
      outline: none;
      resize: none;
      font-size: 1rem;
      color: var(--text-main);
      background: transparent;
    }

    textarea::placeholder {
      color: #a0aec0;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: var(--bg-color);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--neu-btn);
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      box-shadow: var(--neu-btn-active);
    }

    .btn-translate {
      color: var(--primary);
      font-weight: 600;
    }

    .btn-audio {
      color: #10b981; 
      font-weight: 600;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-footer a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
    }

    /* Modal Window */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(224, 229, 236, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-color);
      width: 90%;
      max-width: 420px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--neu-drop);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.15rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-group input {
      background: var(--bg-color);
      border: none;
      outline: none;
      padding: 12px;
      border-radius: 12px;
      box-shadow: var(--neu-inset);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-submit {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="translator-card">
    <div class="card-header">
      <div>
        <div class="card-title">Penerjemah Bahasa Daerah</div>
        <div class="card-subtitle">initialDictionary</div>
      </div>
      <button class="add-word-trigger" id="openModalBtn">
        <i class="fa-solid fa-plus"></i> Tambah Kata
      </button>
    </div>

    <!-- Dropdown Select Bahasa -->
    <div class="language-bar">
      <div class="select-wrapper">
        <select class="lang-select" id="srcLang" title="Pilih Bahasa Sumber"></select>
      </div>

      <button class="swap-btn" id="swapBtn" title="Swap Languages">⇄</button>

      <div class="select-wrapper">
        <select class="lang-select" id="targetLang" title="Pilih Bahasa Tujuan"></select>
      </div>
    </div>

    <div class="card-body">
      <!-- Input Text Container -->
      <div class="text-box-container">
        <textarea id="sourceText" placeholder="Ketik teks di sini..."></textarea>
        <div class="actions">
          <button class="icon-btn btn-audio" id="srcAudioBtn" title="Dengarkan Sumber">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button class="icon-btn" id="clearBtn"><i class="fa-solid fa-xmark"></i> Clear</button>
          <button class="icon-btn btn-translate" id="translateBtn"><i class="fa-solid fa-language"></i> Translate</button>
        </div>
      </div>

      <!-- Output Text Container -->
      <div class="text-box-container">
        <textarea id="targetText" placeholder="Hasil terjemahan akan muncul di sini..." readonly></textarea>
        <div class="actions">
          <button class="icon-btn btn-audio" id="targetAudioBtn" title="Dengarkan Terjemahan">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button class="icon-btn" id="copyBtn"><i class="fa-solid fa-copy"></i> Copy</button>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <span id="wordCountBadge">Total kata: 0</span>
      <div>
        Powered by <a href="https://github.com/karangtarunakubar/kamus_tunjung" target="_blank">Edo Erpani</a>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Kata -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Tambah Kata Baru</h3>
        <button class="icon-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="input-group">
        <label for="newTunjung">Bahasa Daerah</label>
        <input type="text" id="newTunjung" placeholder="Contoh: Emooq">
      </div>

      <div class="input-group">
        <label for="newIndo">Bahasa Indonesia</label>
        <input type="text" id="newIndo" placeholder="Contoh: Tinggi">
      </div>

      <div class="modal-actions">
        <button class="icon-btn btn-submit" id="saveWordBtn">
          <i class="fa-solid fa-check"></i> Simpan
        </button>
      </div>
    </div>
  </div>
    <script>
    // Initial built-in dataset
    const initialDictionary = [
      ["Baq", "Ada"], ["Nya", "apakah"], ["Nyama", "apa"], ["Lonya", "Bagaimana"], ["Menya", "Kemana"], ["Adi", "Berapa"], ["Tih", "Ini"], ["Ito", "Itu"], ["Dito", "Disana"], ["Ditih", "Disini"], ["Dinya", "Dimana"], ["Encoq", "Jauh"], ["Totoq", "Dekat"], ["Emooq", "Tinggi"], ["Itint", "Rendah"], ["Moq", "Panjang"],
      ["Itit", "Kecil"], ["Hajaq", "Besar"], ["Inaq", "Belum"], ["Soq", "Sudah"], ["Perangk", "Panas"], ["Celamp", "Dingin"], ["Isay", "Baru"], ["Isay tih", "Baru ini"], ["Isay nyi", "Baru saja"], ["Mai", "Lama"], ["Nemaq", "Pergi"], ["Diapm", "Tinggal"], ["Mot", "Datang"], ["Buru-buru", "Gagaq"], ["Cepat", "Jamit"], ["Berdohai", "Pelan-pelan"], ["Sengket", "Naik"], ["Mile", "Turun"], ["Tala", "Terang"], ["Gelap", "Gempitaq"], ["Pejai", "Jelek"], ["Pajiq", "Baik"], ["Bajik", "Baik"], 
      ["Mui", "Tidak"], ["Ewah", "Iya"], ["Heq", "Enggak"], ["Lat", "Bohong"],
      ["Hitam", "Permaq"], ["Biru", "Nahum"], ["Bohongq", "Merah"], ["Putiq", "Putih"], 
      ["Bueh","Satu"], ["Regaq","Dua"], ["Teluq","Tiga"], ["Pat","Empat"], ["Limaq","Lima"], ["Hagant","Enam"],["Tucuq","Tujuh"],["Kalungk","Delapan"], ["Setiant","Sembilan"], ["Sawangk","Sepuluh"], 
      ["Belas", "Sebelas"], ["Cahatu","Seratus"], ["Ribu","Seribu"], ["Juta","Sejuta"], ["Gari", "Adik"], ["Mpom Lihaq", "Kakek"], ["Mpom Waweq", "Nenek"], ["Ucuq", "Paman"], 
      ["Wanaq","Suami"], ["Sagaq", "Istri"], ["Akuq", "Aku"], ["Koi", "Kamu"], ["Kamiq", "Kami"], ["Tai", "Kita"], ["Kamp", "Kalian"], ["Eraq", "Mereka"], ["Ulunt", "Orang"],
      ["Mersiaq", "Manusia"], ["Ulunt Pelagaq", "Orang Tua"], ["Pelegaq Mai", "Leluhur"], ["Pelegaq", "Tua"], ["Kabant Tuhiq", "Anak-anak"], ["Tuhiq", "Anak"], ["Encunt", "Cucu"], ["Mulai", "Mulai"], ["Tagaq", "Tertawa"], ["Nangi", "Menangis"], ["Tiro", "Tidur"], ["Kuman", "Makan"], ["Muruq", "Minum"], ["Bejalan", "Ngedot"], ["teliuq", "Berlari"], ["Ngaweng", "Memanjat"], ["Tepatiiq", "Melompat"], ["Nulis", "Menulis"], ["Maca", "Membaca"],
      ["Angka", "Kira-kira"], ["Angkake", "Kiranya"], ["Angkai", "Bangkai"], ["Laitn", "Lain"], ["Laoq", "Lapar"], ["Lea", "Bosan"], ["Loah", "Mual"],
      ["Loaaq", "Lemak"], ["Loan", "Lemak"], ["Loseeu", "Longgar"], ["Luuok", "Lubang"], ["Nau", " Hari"], ["Dilau", "Besok"], ["Telamaq", "Depan"], ["Lituq", "Belakang"], ["Ulant", "Bulan"], ["Taont", "Tahun"], ["Bunuh diri", "Mentiuuq"], ["Meraiq", "Melerai"],
      ["Nerdaatn", "Berterus terang"], ["Jaur", "Kabur"], ["Keracunan", "Keliuq"], ["Nguit", "Menyukit"], ["Leler-maer", "Tidak Terurus"], ["Tertimpa", "Keluatn"]     
];

    function loadDictionary() {
      const stored = localStorage.getItem("tunjung_custom_dict");
      if (stored) {
        try {
          return [...initialDictionary, ...JSON.parse(stored)];
        } catch (e) {
          return [...initialDictionary];
        }
      }
      return [...initialDictionary];
    }

    let activeDictionary = loadDictionary();

    const tribe_in_language = {
      "id-ID": "Indonesia",
      "tj-TJ": "Tunjung",
      "ky-KY": "Kenyah",
      "bq-BQ": "Benuaq",
      "bh-BH": "Bahau",
      "kt-KT": "Kutai"
    };

    const selectTags = document.querySelectorAll("select");
    selectTags.forEach(tag => {
      for (const key in tribe_in_language) {
          const option = document.createElement("option");
          option.value = key;
          option.textContent = tribe_in_language[key];
          tag.appendChild(option);
      }
    });

    const sourceText = document.getElementById("sourceText");
    const targetText = document.getElementById("targetText");
    const srcLang = document.getElementById("srcLang");
    const targetLang = document.getElementById("targetLang");
    const swapBtn = document.getElementById("swapBtn");
    
    srcLang.value = "id-ID";
    targetLang.value = "tj-TJ";

    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const translateBtn = document.getElementById("translateBtn");
    const srcAudioBtn = document.getElementById("srcAudioBtn"); 
    const targetAudioBtn = document.getElementById("targetAudioBtn"); 
    const wordCountBadge = document.getElementById("wordCountBadge");

    function updateBadge() {
      wordCountBadge.textContent = `Total kata: ${activeDictionary.length}`;
    }

    function translate() {
      let text = sourceText.value.trim().toLowerCase();
      if (!text) {
        targetText.value = "";
        return;
      }

      const words = text.split(/\s+/);
      const translatedWords = words.map(word => {
        const cleanWord = word.replace(/[^\w\s]/gi, '');
        let match = null;

        for (const [ty, id] of activeDictionary) {
          if (!ty || !id) continue;
          
          if (srcLang.value === "id-ID") {
            const idList = id.toLowerCase().split(",").map(s => s.trim());
            if (idList.includes(cleanWord)) {
              match = ty;
              break;
            }
          } else {
            if (ty.toLowerCase() === cleanWord) {
              match = id;
              break;
            }
          }
        }
        return match ? match : word;
      });

      targetText.value = translatedWords.join(" ");
    }

    translateBtn.addEventListener("click", () => {
      let text = sourceText.value;
      if(text.trim() !== "") {
        translate();
      } else {
        targetText.value = "Silakan masukkan teks terlebih dahulu.";
        setTimeout(() => targetText.value = "", 2000);
      }
    });

    // Fungsi Utama Text-to-Speech (Speak Audio)
    function playAudio(text, btnElement) {
      if (!text || text === "Silakan masukkan teks terlebih dahulu.") {
        alert("Tidak ada teks untuk dibacakan.");
        return;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Hentikan audio sebelumnya jika ada
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "id-ID"; // Default pengucapan bahasa Indonesia
        
        const originalHTML = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fa-solid fa-volume-up fa-beat-fade"></i>';
        
        utterance.onend = () => { btnElement.innerHTML = originalHTML; };
        utterance.onerror = () => { btnElement.innerHTML = originalHTML; };

        window.speechSynthesis.speak(utterance);
      } else {
        alert("Maaf, browser Anda tidak mendukung fitur Text-to-Speech.");
      }
    }

    // Listener Tombol Speak Teks Sumber & Terjemahan
    srcAudioBtn.addEventListener("click", () => playAudio(sourceText.value.trim(), srcAudioBtn));
    targetAudioBtn.addEventListener("click", () => playAudio(targetText.value.trim(), targetAudioBtn));

    // Swap Bahasa & Teks
    swapBtn.addEventListener("click", () => {
      const tempLang = srcLang.value;
      srcLang.value = targetLang.value;
      targetLang.value = tempLang;

      const tempText = sourceText.value;
      sourceText.value = targetText.value;
      
      if(sourceText.value.trim() !== "") {
         translate();
      } else {
         targetText.value = "";
      }
    });

    // Modal Add Word
    const modalOverlay = document.getElementById("modalOverlay");
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const saveWordBtn = document.getElementById("saveWordBtn");
    const newTunjung = document.getElementById("newTunjung");
    const newIndo = document.getElementById("newIndo");

    openModalBtn.addEventListener("click", () => modalOverlay.classList.add("active"));
    closeModalBtn.addEventListener("click", () => modalOverlay.classList.remove("active"));

    saveWordBtn.addEventListener("click", () => {
      const tyVal = newTunjung.value.trim();
      const idVal = newIndo.value.trim();

      if (!tyVal || !idVal) {
        alert("Harap isi kedua kolom!");
        return;
      }

      const customEntries = JSON.parse(localStorage.getItem("tunjung_custom_dict") || "[]");
      customEntries.push([tyVal, idVal]);
      localStorage.setItem("tunjung_custom_dict", JSON.stringify(customEntries));

      activeDictionary = loadDictionary();
      updateBadge();
      
      if(sourceText.value.trim() !== "") {
        translate();
      }

      newTunjung.value = "";
      newIndo.value = "";
      modalOverlay.classList.remove("active");
    });

    clearBtn.addEventListener("click", () => {
      sourceText.value = "";
      targetText.value = "";
    });

    copyBtn.addEventListener("click", () => {
      if (targetText.value) {
        navigator.clipboard.writeText(targetText.value);
        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => { copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy'; }, 1500);
      }
    });

    updateBadge();
    </script>
    <!-- Load the data first -->
    <script src="tribe.js"></script>
    <!-- Load the logic second -->
    <script src="script.js"></script>
    <!-- Load the main app logic last --> 
  <script src="app.js"></script>
</body>
</html>
